# Any SMS messages received by the RUT will be forwarded the the specified number.
- name: SMS forwarding
  community.openwrt.uci:
    cmd: set
    config: sms_gateway
    section: to_sms
    value:
      enabled: "1"
      fwd_number:
        - "+447441137136"
      sender_num: "1"
      every_sms: "1"
      mode: "everyone"

