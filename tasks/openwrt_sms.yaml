# The following SMS message will be sent by the RUT when it receives an SMS message with "{{password}} status"
- name: SMS status command
  community.openwrt.uci:
    cmd: section
    config: sms_utils
    type: rule
    find:
      smstext: "status"
    value:
      enabled: "1"
      message: "Status Request!\nRouter: %rn\nFirmware: %fc\nWAN IP: %wi\nLAN IP: %li\nSignal: %ss dB\nNetwork: %ct %on\nData state: %cs\nRMS Error: %er"