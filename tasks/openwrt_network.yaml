- name: Router IP
  community.openwrt.uci:
    cmd: set
    config: network
    section: lan
    value:
      ipaddr: "{{ IP_24 }}.254"

# Only applies to sites with a static IP defined
- name: Static WAN IP
  when: STATIC_IP is defined
  community.openwrt.uci:
    cmd: set
    config: network
    section: wan
    value:
      proto: "static"
      ipaddr: "{{ STATIC_IP }}"
      netmask: "255.255.255.0"
      gateway: "{{ GATEWAY }}"

- name: LAN DHCP settings
  community.openwrt.uci:
    cmd: set
    config: dhcp
    section: lan
    value:
      # DHCP address range 50 to 150. (101 addresses)
      start: "50"
      limit: "101"
      force: "1"  # Force this DHCP server to be used over others
      # Explicitly enable DHCP on IPv4 and IPv6
      dhcpv6: "server"
      ra: "server"

- name: CCTV static IP
  when: CCTV_MAC is defined
  vars:
    ip: "{{ IP_24 }}.110"
  community.openwrt.uci:
    cmd: section
    config: dhcp
    type: host
    find:
      ip: "{{ ip }}"
    value:
      name: "CCTV"
      mac: "{{ CCTV_MAC }}"
      ip: "{{ ip }}"

- name: IPv4 DNS
  community.openwrt.uci:
    cmd: set
    config: network
    section: wan
    value:
      dns:
        - "8.8.8.8"
        - "8.8.4.4"
      peerdns: "0"

- name: IPv6 DNS
  community.openwrt.uci:
    cmd: set
    config: network
    section: wan6
    value:
      dns:
        - "2001:4860:4860::8888"
        - "2001:4860:4860::8844"
      peerdns: "0"

# SIM cards
- name: SIM 1 APN
  community.openwrt.uci:
    cmd: set
    config: network
    section: mob1s1a1
    value:
      metric: "3"
      force_link: "1"
      auto_apn: "1"
      auth: "none"

- name: SIM 2 APN
  community.openwrt.uci:
    cmd: set
    config: network
    section: mob1s2a1
    value:
      metric: "4"
      force_link: "1"
      auto_apn: "0"
      auth: "pap"
      apn: "eapn1.net"
      username: "{{ vault_apn_username }}"
      password: "{{ vault_apn_password }}"

# WiFi
- name: WiFi key
  community.openwrt.uci:
    cmd: section
    config: wireless
    type: wifi-iface
    find:
      device: "radio0"
      mode: "ap"
    value:
      ssid: "{{ inventory_hostname }}-staff"
      key: "{{ wifi_password }}"
  no_log: true

- name: WiFi delete radio1
  community.openwrt.uci:
    cmd: absent
    config: wireless
    section: default_radio1

- name: RUTM55 second radio
  when: ansible_facts.openwrt_board.model == "Teltonika RUTM55"
  community.openwrt.uci:
    cmd: set
    config: wireless
    section: default_radio0
    value:
      device:
        - "radio0"
        - "radio1"